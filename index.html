<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>FinGramate</title>
<style>
:root{
 --bg:#0b0f19;--bg2:#111827;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.11);
 --text:#f7f8fb;--muted:#98a2b3;--accent:#7c5cff;--accent2:#a78bfa;
 --good:#31d08a;--bad:#ff647c;--shadow:0 20px 60px rgba(0,0,0,.28);
}
[data-theme="light"]{--bg:#eef2f7;--bg2:#f8fafc;--card:rgba(255,255,255,.62);--line:rgba(15,23,42,.10);--text:#101828;--muted:#667085;--shadow:0 20px 50px rgba(31,41,55,.12)}
[data-theme="blue"]{--accent:#3b82f6;--accent2:#60a5fa}
[data-theme="green"]{--accent:#10b981;--accent2:#34d399}
[data-theme="pink"]{--accent:#ec4899;--accent2:#f472b6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 32%),
 radial-gradient(circle at 100% 20%,rgba(56,189,248,.12),transparent 30%),var(--bg);
 color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:auto;padding:18px 16px 105px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-size:24px;font-weight:800}.brand span{color:var(--accent2)}
.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:15px;background:var(--card);backdrop-filter:blur(22px);color:var(--text)}
.card{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:25px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:7px}
.total{font-size:36px;font-weight:850;letter-spacing:-1px}
.progress{height:12px;border-radius:99px;background:rgba(128,128,128,.18);overflow:hidden;margin:18px 0 10px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:.45s}
.row{display:flex;justify-content:space-between;gap:10px}
.stat{flex:1}.stat b{display:block;font-size:17px}.stat small{color:var(--muted)}
.tabs{display:flex;gap:8px;margin:8px 0 14px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px;border-radius:15px}
.tab.active{background:var(--accent);color:white;border-color:transparent}
.screen{display:none}.screen.active{display:block}
.debt{padding:16px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.035);margin-bottom:10px}
.debt-top{display:flex;justify-content:space-between;gap:10px}.debt-name{font-weight:750}.debt-amount{font-weight:800}
.mini{height:7px;margin:10px 0;background:rgba(128,128,128,.17);border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:var(--accent);border-radius:99px}
.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.primary{background:var(--accent)!important;color:#fff!important;border-color:transparent!important}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);outline:none;margin:6px 0 10px}
label{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.history{font-size:14px}.history div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.empty{color:var(--muted);text-align:center;padding:22px}
.nav{position:fixed;z-index:5;left:50%;bottom:12px;transform:translateX(-50%);width:min(540px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border:1px solid var(--line);border-radius:22px;background:rgba(15,18,28,.72);backdrop-filter:blur(24px)}
[data-theme="light"] .nav{background:rgba(255,255,255,.72)}
.nav button{border:0;background:none;color:var(--muted);padding:8px 4px;border-radius:15px}.nav button.active{color:var(--text);background:rgba(255,255,255,.09)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;z-index:10}.sheet.open{display:flex}
.modal{width:min(560px,100%);margin:auto auto 0;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px;max-height:88vh;overflow:auto}
.close{float:right;border:0;background:none;color:var(--muted);font-size:24px}
.theme-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.theme{height:42px;border-radius:14px;border:2px solid transparent}.theme.sel{border-color:var(--text)}
.t-dark{background:#0b0f19}.t-light{background:#eef2f7}.t-blue{background:#2563eb}.t-green{background:#059669}.t-pink{background:#db2777}
.toast{position:fixed;z-index:20;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:#171b26;color:white;padding:12px 16px;border-radius:14px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">Fin<span>Gramate</span></div><button class="icon" onclick="openSheet('settings')">⚙️</button></header>

<section id="home" class="screen active">
<div class="card">
<div class="eyebrow">Общий остаток долгов</div>
<div class="total" id="total">0 ₽</div>
<div class="progress"><i id="totalBar"></i></div>
<div class="row">
<div class="stat"><b id="paid">0 ₽</b><small>выплачено</small></div>
<div class="stat"><b id="percent">0%</b><small>прогресс</small></div>
</div>
</div>
<div class="card">
<div class="eyebrow">Доходы за месяц</div>
<div class="total" id="income">0 ₽</div>
<div class="row" style="margin-top:15px"><button class="tab active" onclick="openSheet('income')">+ Добавить доход</button></div>
</div>
<div class="card"><div class="eyebrow">Ближайший ориентир</div><div id="forecast">Добавь доходы и долги — здесь появится расчёт.</div></div>
</section>

<section id="debts" class="screen">
<div class="card"><div class="row"><div><div class="eyebrow">Мои долги</div><b>До 10 обязательств</b></div><button class="icon" onclick="openSheet('debt')">＋</button></div></div>
<div id="debtList"></div>
</section>

<section id="history" class="screen">
<div class="card"><div class="eyebrow">История платежей и доходов</div><div id="historyList" class="history"></div></div>
</section>

<section id="more" class="screen">
<div class="card">
<div class="eyebrow">Данные</div>
<button class="tab" style="width:100%;margin-bottom:8px" onclick="exportData()">Экспортировать данные</button>
<button class="tab" style="width:100%;color:var(--bad)" onclick="resetAll()">Сбросить всё</button>
</div>
<div class="card"><div class="eyebrow">О приложении</div><b>FinGramate</b><p style="color:var(--muted)">Личный трекер долгов, доходов и финансового прогресса.</p></div>
</section>
</div>

<nav class="nav">
<button class="active" onclick="show('home',this)">⌂<br><small>Главная</small></button>
<button onclick="show('debts',this)">₽<br><small>Долги</small></button>
<button onclick="show('history',this)">↗<br><small>История</small></button>
<button onclick="show('more',this)">•••<br><small>Ещё</small></button>
</nav>

<div class="sheet" id="sheet"><div class="modal"><button class="close" onclick="closeSheet()">×</button><div id="sheetContent"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='fingramate_v3';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{debts:[],income:[],history:[],theme:'dark'};
const fmt=n=>new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function show(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function openSheet(type,id){
let c='';
if(type==='income') c=`<h2>Добавить доход</h2><label>Сумма</label><input id="amount" type="number" placeholder="Например, 60000"><label>Источник</label><input id="source" placeholder="Курьер, зарплата..."><button class="tab primary" style="width:100%" onclick="addIncome()">Сохранить</button>`;
if(type==='debt') c=`<h2>Новый долг</h2><label>Название</label><input id="dname" placeholder="Кредитная карта"><label>Сумма долга</label><input id="damount" type="number" placeholder="70000"><button class="tab primary" style="width:100%" onclick="addDebt()">Добавить долг</button>`;
if(type==='pay') c=`<h2>Платёж</h2><div class="eyebrow">${data.debts[id].name}</div><div style="font-size:28px;font-weight:800">${fmt(data.debts[id].left)}</div><label>Сколько заплатил?</label><input id="amount" type="number" placeholder="5000"><button class="tab primary" style="width:100%" onclick="pay(${id})">Засчитать платёж</button>`;
if(type==='settings') c=`<h2>Тема приложения</h2><p class="eyebrow">Выбери оформление</p><div class="theme-row">${[['dark','t-dark'],['light','t-light'],['blue','t-blue'],['green','t-green'],['pink','t-pink']].map(x=>`<button class="theme ${x[0]===data.theme?'sel':''} ${x[1]}" onclick="setTheme('${x[0]}')"></button>`).join('')}</div><h3 style="margin-top:25px">Как использовать</h3><p style="color:var(--muted)">Добавь до 10 долгов, записывай доходы и каждый платёж. Прогресс сохраняется прямо в браузере этого устройства.</p>`;
document.getElementById('sheetContent').innerHTML=c;document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function addIncome(){let a=+document.getElementById('amount').value;if(!a)return;data.income.push({amount:a,source:document.getElementById('source').value||'Доход',date:new Date().toLocaleDateString('ru-RU')});data.history.unshift({type:'income',amount:a,text:'Доход: '+(document.getElementById('source').value||'Доход'),date:new Date().toLocaleString('ru-RU')});closeSheet();save();toast('Доход добавлен')}
function addDebt(){let n=document.getElementById('dname').value.trim(),a=+document.getElementById('damount').value;if(!n||!a||data.debts.length>=10)return toast('Заполни название и сумму');data.debts.push({name:n,total:a,left:a,paid:0});closeSheet();save();toast('Долг добавлен')}
function pay(i){let a=+document.getElementById('amount').value;if(!a||a<=0)return;if(a>data.debts[i].left)a=data.debts[i].left;data.debts[i].left-=a;data.debts[i].paid+=a;data.history.unshift({type:'pay',amount:a,text:'Платёж: '+data.debts[i].name,date:new Date().toLocaleString('ru-RU')});closeSheet();save();toast('Платёж засчитан')}
function setTheme(t){data.theme=t;document.documentElement.dataset.theme=t;save();openSheet('settings')}
function render(){
document.documentElement.dataset.theme=data.theme;
let total=data.debts.reduce((s,d)=>s+d.left,0),paid=data.debts.reduce((s,d)=>s+d.paid,0),start=total+paid;
document.getElementById('total').textContent=fmt(total);document.getElementById('paid').textContent=fmt(paid);
let p=start?Math.round(paid/start*100):0;document.getElementById('percent').textContent=p+'%';document.getElementById('totalBar').style.width=p+'%';
let inc=data.income.reduce((s,x)=>s+x.amount,0);document.getElementById('income').textContent=fmt(inc);
document.getElementById('debtList').innerHTML=data.debts.length?data.debts.map((d,i)=>{let q=d.total?Math.round(d.paid/d.total*100):0;return `<div class="debt"><div class="debt-top"><div class="debt-name">${escapeHtml(d.name)}</div><div class="debt-amount">${fmt(d.left)}</div></div><div class="mini"><i style="width:${q}%"></i></div><div class="row" style="font-size:12px;color:var(--muted);margin-bottom:10px"><span>${q}% выплачено</span><span>из ${fmt(d.total)}</span></div><div class="actions"><button class="primary" onclick="openSheet('pay',${i})">＋ Платёж</button><button onclick="deleteDebt(${i})">Удалить</button></div></div>`}).join(''):'<div class="card empty">Пока нет долгов. Добавь первое обязательство.</div>';
document.getElementById('historyList').innerHTML=data.history.length?data.history.slice(0,50).map(x=>`<div><span>${escapeHtml(x.text)}<br><small style="color:var(--muted)">${x.date}</small></span><b style="color:${x.type==='pay'?'var(--good)':'var(--accent2)'}">${x.type==='pay'?'-':'+'}${fmt(x.amount)}</b></div>`).join(''):'<div class="empty">История пока пустая.</div>';
document.getElementById('forecast').textContent=inc&&total?'При текущем доходе ты видишь общий финансовый прогресс: '+p+'% долгов уже закрыто.':'Добавь доходы и долги — здесь появится расчёт.';
}
function deleteDebt(i){if(confirm('Удалить этот долг?')){data.debts.splice(i,1);save()}}
function resetAll(){if(confirm('Точно удалить все данные?')){localStorage.removeItem(KEY);location.reload()}}
function exportData(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='fingramate-data.json';a.click()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
render();
</script>
</body>
</html>
